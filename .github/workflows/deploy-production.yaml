name: Deploy to Firebase (production)

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: "firebase-deploy-production"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      FIREBASE_PROJECT_ALIAS: ${{ vars.FIREBASE_PROJECT_ALIAS }}
      VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
      VITE_CADERNIN_UID: ${{ vars.CADERNIN_UID }}
      VITE_APP_TITLE: ${{ vars.APP_TITLE}}
      VITE_FEATURE_FLAG_COLLAB_FLOW: ${{ vars.FEATURE_FLAG_COLLAB_FLOW}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install functions dependencies
        run: npm ci --prefix functions
      - name: Build
        run: npm run build
      - name: Check functions
        run: |
          npm --prefix functions run lint
          npm --prefix functions run build
      - name: Authenticate
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
      - name: Migrate schema
        env:
          SCRIPTS_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          SCRIPTS_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          SCRIPTS_CADERNIN_UID: ${{ vars.CADERNIN_UID }}
        run: npx tsx scripts/migrations/migrate.ts --execute --forward-only
      - name: Configure Storage CORS
        run: >-
          gcloud storage buckets update "gs://$VITE_FIREBASE_STORAGE_BUCKET"
          --project "$VITE_FIREBASE_PROJECT_ID" --cors-file=cors.json
      - name: Deploy
        run: npx firebase-tools deploy --project "$VITE_FIREBASE_PROJECT_ID"
