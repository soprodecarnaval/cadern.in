<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>006 · Capa</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 var(--font-sans,Inter,system-ui);background:var(--background,#fff);color:var(--foreground,#222)}.controls{padding:14px 20px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:var(--muted,#f4f4f5);border-bottom:1px solid var(--border,#ddd)}.controls select{font:inherit;padding:5px;border:1px solid var(--border,#ccc);border-radius:5px;background:var(--background,#fff);color:var(--foreground,#222)}.mock{background:#fff;color:#212529;position:relative;min-height:730px;padding:24px}.page{max-width:930px;margin:auto}.page h2{font-size:22px;font-weight:500}.row{padding:13px;border:1px solid #dee2e6;display:flex;gap:12px;align-items:center}.grow{flex:1}.mock button{font:inherit;padding:7px 13px;border-radius:5px;border:1px solid #0d6efd;background:#0d6efd;color:white;cursor:pointer}.mock button.outline{color:#0d6efd;background:#fff}.mock button.gray{background:white;color:#6c757d;border-color:#6c757d}.mock button.danger{background:white;color:#b02a37;border-color:#b02a37}.mock button:disabled{opacity:.55;cursor:default}.saved{color:#198754;font-size:13px}.backdrop{position:absolute;inset:0;background:#0007;padding:28px 16px;display:flex;align-items:flex-start;justify-content:center}.modal{width:760px;max-width:100%;background:#fff;border:1px solid #0003;box-shadow:0 12px 38px #0003;border-radius:8px;overflow:hidden}.header{padding:16px 22px;border-bottom:1px solid #dee2e6;display:flex;align-items:center;gap:12px}.header h1{font-size:21px;font-weight:500;margin:0;flex:1}.mock .close{color:#6c757d;background:transparent;border:none;font-size:25px;padding:0 4px;line-height:1}.body{padding:20px 22px}.muted{color:#6c757d;font-size:13px}.preview{margin:15px 0 10px;background:#e9ecef;padding:16px;border-radius:6px}.sheet{aspect-ratio:18/13;background:white;box-shadow:0 2px 7px #0002;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.sheet svg,.sheet img{display:block;width:100%;height:100%;object-fit:contain}.blank{font-size:clamp(12px,2.5vw,22px);position:absolute;left:24%;top:26%;line-height:1.2}.blank small{font-size:80%}.size{text-align:center;font-size:12px;color:#6c757d;margin:8px 0 0}.selection{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.file{font-size:13px;color:#495057;overflow-wrap:anywhere}.footer{border-top:1px solid #dee2e6;padding:14px 22px;display:flex;justify-content:flex-end;gap:8px}.alert{margin-top:14px;border:1px solid #f1aeb5;background:#f8d7da;color:#842029;border-radius:5px;padding:10px 12px}.status{margin-top:12px;color:#495057;font-size:13px}.spin{display:inline-block;width:16px;height:16px;border:2px solid #ccc;border-top-color:#0d6efd;border-radius:50%;animation:turn 1s linear infinite;vertical-align:middle;margin-right:7px}@keyframes turn{to{transform:rotate(360deg)}}[hidden]{display:none!important}@media(max-width:600px){.mock{padding:16px;min-height:680px}.backdrop{padding:20px 10px}.body{padding:16px}.header{padding:14px 16px}.preview{padding:10px}.footer{padding:14px 16px}.header h1{font-size:19px}.controls{padding:12px}.selection{gap:8px}}
</style><div class="controls"><b>006 · Mockup v1</b><label>Estado <select id="state"><option value="saved">Capa existente</option><option value="empty">Sem capa</option><option value="draft">Substituição selecionada</option><option value="removed">Remoção pendente</option><option value="loading">Carregando prévia</option><option value="saving">Salvando</option><option value="error">Falha ao salvar</option><option value="invalid">Arquivo inválido</option><option value="readonly">Sem permissão</option></select></label><label>Instrumento <select id="instrument"><option>Flauta</option><option>Trompete</option></select></label></div><div class="mock"><div class="page"><h2>Gerar caderninhos</h2><div class="row"><span>☑</span><span class="grow">FLAUTA</span><span>(12/12)</span><button class="outline" id="open">✓ Trocar capa</button></div><div class="row"><span>☑</span><span class="grow">TROMPETE</span><span>(10/12)</span><span class="saved">✓ Capa</span></div><p class="muted">Capa e índice do carnaval　○</p><button>Gerar 2 caderninhos</button><p class="muted" id="pageNote"></p></div><div class="backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="heading"><header class="header"><h1 id="heading">Capa · Flauta</h1><button class="close" aria-label="Fechar" id="close">×</button></header><div class="body"><div class="muted">Carnaval 2026 · Prévia da primeira página do PDF</div><div class="preview"><div class="sheet" id="sheet"></div><p class="size">18 × 13 cm · paisagem</p></div><p class="muted" id="caption">Capa salva para este instrumento.</p><div class="selection"><button class="outline" id="select">Selecionar imagem</button><button class="danger" id="remove">Remover capa</button><input type="file" accept="image/png,image/jpeg" id="file" hidden></div><p class="file" id="filename"></p><div class="muted">PNG ou JPEG. A imagem é ajustada à página sem recorte.</div><div class="status" id="status" hidden></div><div class="alert" id="error" role="alert" hidden></div></div><footer class="footer"><button class="gray" id="cancel">Cancelar</button><button id="save" disabled>Salvar</button></footer></div></div></div><script>
const el=id=>document.getElementById(id);let open=true,image=null,old='saved';
function art(draft){return `<svg viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg"><rect width="720" height="520" fill="${draft?'#143c47':'#f5e9d0'}"/><circle cx="680" cy="80" r="220" fill="${draft?'#f2ba43':'#dc6846'}"/><circle cx="20" cy="490" r="180" fill="${draft?'#e27764':'#267b7c'}"/><path d="M430 350Q600 180 760 320" fill="none" stroke="${draft?'#6eada0':'#edbf4d'}" stroke-width="80"/><g fill="${draft?'#fff5dc':'#173d44'}" font-family="Arial,sans-serif"><text x="62" y="145" font-size="20" letter-spacing="5">BLOCO EXEMPLO</text><text x="56" y="228" font-size="64" font-weight="bold">CARNAVAL</text><text x="58" y="298" font-size="64" font-weight="bold">2026</text><text x="62" y="366" font-size="27">${el('instrument').value.toUpperCase()}</text></g></svg>`}
function render(){const s=el('state').value,busy=s==='saving',empty=s==='empty'||s==='removed',dirty=['draft','removed','error','saving'].includes(s);el('backdrop').hidden=!open||s==='readonly';el('heading').textContent='Capa · '+el('instrument').value;el('sheet').innerHTML=s==='loading'?'<div class="spin" aria-label="Carregando prévia"></div>':empty?'<div class="blank">CARNAVAL 2026<br><small>'+el('instrument').value.toUpperCase()+'</small></div>':image&&dirty?'<img alt="Imagem selecionada" src="'+image+'">':art(dirty);el('caption').textContent=s==='removed'?'A capa será removida ao salvar.':s==='empty'?'Nenhuma imagem salva. A prévia mostra a página padrão.':dirty?'Alteração ainda não salva.':'Capa salva para este instrumento.';el('filename').textContent=empty?'':dirty?'nova-capa.png':'capa-carnaval-2026.png';el('save').disabled=!dirty||busy;el('save').innerHTML=busy?'<span class="spin"></span>Salvando…':'Salvar';for(const id of ['select','remove','close','cancel'])el(id).disabled=busy;el('remove').hidden=empty;el('error').hidden=!['error','invalid'].includes(s);el('error').textContent=s==='invalid'?'Selecione uma imagem PNG ou JPEG. A capa anterior foi mantida.':'Não foi possível salvar a capa. Tente novamente ou cancele.';el('status').hidden=!busy;el('status').textContent='Enviando imagem e salvando nova versão…';el('open').hidden=s==='readonly';el('pageNote').textContent=s==='readonly'?'✓ Capa salva. Edição disponível apenas para dono/admin na versão atual.':''}
function dismiss(){if(el('state').value==='saving')return;open=false;image=null;el('state').value=old;render()}
el('state').onchange=()=>{open=true;image=null;if(['saved','empty'].includes(el('state').value))old=el('state').value;render()};el('instrument').onchange=()=>{open=true;image=null;el('state').value=old;render()};el('open').onclick=()=>{open=true;render()};el('cancel').onclick=dismiss;el('close').onclick=dismiss;el('backdrop').onclick=e=>{if(e.target===el('backdrop'))dismiss()};document.addEventListener('keydown',e=>{if(e.key==='Escape')dismiss()});el('remove').onclick=()=>{el('state').value='removed';render()};el('select').onclick=()=>el('file').click();el('file').onchange=()=>{const f=el('file').files[0];if(!f)return;if(!['image/png','image/jpeg'].includes(f.type)){el('state').value='invalid';render();return}const reader=new FileReader();reader.onload=()=>{image=reader.result;el('state').value='draft';render()};reader.readAsDataURL(f)};el('save').onclick=()=>{old=el('state').value==='removed'?'empty':'saved';open=false;image=null;el('state').value=old;render();el('pageNote').textContent='Capa salva. A geração usa a versão atualizada.'};render();
</script></html>
