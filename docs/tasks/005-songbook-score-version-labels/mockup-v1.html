<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>005 · Versões fixadas</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 var(--font-sans,Inter,system-ui);background:var(--background,#fff);color:var(--foreground,#202124)}.controls{padding:14px 20px;background:var(--muted,#f4f4f5);border-bottom:1px solid var(--border,#ddd);display:flex;gap:14px;flex-wrap:wrap;align-items:center}.controls select{font:inherit;padding:5px;border-radius:5px;border:1px solid var(--border,#ccc);background:var(--background,#fff);color:var(--foreground,#222)}.note{padding:12px 20px;color:var(--muted-foreground,#666);font-size:13px}.mock{background:white;color:#212529;min-height:470px}.nav{background:#212529;color:#adb5bd;padding:14px 24px;display:flex;gap:26px;align-items:center}.brand{font-size:26px;color:white}.account{margin-left:auto}.content{padding:28px;max-width:980px;margin:auto}h1{font-size:29px;font-weight:500;margin:0 0 4px}h1 small{color:#6c757d;font-size:16px}a{color:#0d6efd;text-decoration:underline;cursor:pointer}.breadcrumb{margin-bottom:24px;color:#6c757d}.tools{display:flex;gap:8px;margin-bottom:22px}.mock button{border:1px solid #0d6efd;background:white;color:#0d6efd;padding:6px 12px;border-radius:5px;font:inherit;cursor:pointer}.mock button.gray{border-color:#6c757d;color:#6c757d}.group{font-weight:600;margin:16px 0 0;padding:9px 8px;border-bottom:1px solid #dee2e6}table{border-collapse:collapse;width:100%}td{padding:13px 8px;border-bottom:1px solid #dee2e6;vertical-align:middle}.num{width:36px;color:#6c757d}.composer{color:#6c757d}.label{color:#6c757d;font-size:12px;margin-top:3px;overflow-wrap:anywhere}.badge{font-size:11px;background:#ffc107;color:#212529;border-radius:5px;padding:4px 6px;font-weight:600}.right{text-align:right;white-space:nowrap}.removed{color:#6c757d}.hint{font-size:13px;color:#6c757d;margin-top:14px}.reader{max-width:580px;margin:auto}.reader h1{font-size:21px;font-weight:600}.search{border:1px solid #ced4da;border-radius:6px;padding:8px 12px;margin:18px 0;color:#6c757d}.reader td{padding-top:12px;padding-bottom:12px}.reader .title{font-weight:500}.cards{display:grid;gap:10px;max-width:580px}.card{display:flex;align-items:center;gap:14px;border:1px solid #dee2e6;border-radius:6px;padding:13px}.card .label{font-size:13px}.title{overflow-wrap:anywhere}.alert{padding:14px;border:1px solid #9eeaf9;border-radius:6px;background:#cff4fc;color:#055160}.alert.fail{background:#f8d7da;color:#842029;border-color:#f1aeb5}.spinner{width:26px;height:26px;border:3px solid #ddd;border-top-color:#0d6efd;border-radius:50%;margin:24px auto;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:600px){.content{padding:22px 16px}.nav{padding:12px 16px}.build{display:none}h1{font-size:25px}td{padding:12px 5px}.composer{font-size:12px}.right{white-space:normal}.badge{display:inline-block}.controls{padding:12px}.tools{flex-wrap:wrap}}
</style><div class="controls"><b>005 · Mockup v1</b><label>Vista <select id="view"><option value="details">Detalhes</option><option value="reader">Índice do leitor</option><option value="editor">Lista selecionada no editor</option></select></label><label>Perfil <select id="role"><option value="member">Membro</option><option value="public">Público</option></select></label><label>Estado <select id="state"><option value="normal">Normal</option><option value="unavailable">Projeto sem título disponível</option><option value="loading">Carregando</option><option value="empty">Vazio</option><option value="error">Falha</option></select></label></div><div class="note">Caderninho do projeto <b>bloco-exemplo</b>. A segunda música fixa v2, mesmo existindo v5. O rótulo não muda com o perfil.</div><div class="mock"><nav class="nav"><span class="brand">cadern.in</span><span class="build">Montar caderninho</span><span class="account" id="account">Meus projetos · Marina</span></nav><main class="content" id="content"></main></div>
<script>
const el=id=>document.getElementById(id);
function render(){const view=el('view').value,state=el('state').value,pub=el('role').value==='public';el('account').textContent=pub?'Entrar':'Meus projetos · Marina';const rows=[{n:1,title:'Aquarela do Brasil',composer:'Ary Barroso',label:'v3'},{n:2,title:'Ô abre alas',composer:'Chiquinha Gonzaga',label:(state==='unavailable'?'projeto-externo':'bloco-vizinho')+'/v2',stale:true},{n:3,title:'Carinhoso',composer:'Pixinguinha',label:'v1',deleted:true}];let header='<h1>Carnaval 2026 <small>versão #4</small></h1><div class="breadcrumb"><a>abrir caderninho</a> · <a>caderninhos do projeto</a></div>';let tools=pub?'':'<div class="tools"><button>Editar</button><button class="gray">Atualizar todas (1)</button><button class="gray">Despublicar</button></div>';let body='';if(state==='loading')body='<div class="spinner" aria-label="Carregando"></div>';else if(state==='empty')body='<div class="alert">Nenhuma partitura neste caderninho.</div>';else if(state==='error')body='<div class="alert fail">Não foi possível carregar o caderninho.</div>';else if(view==='editor'){body='<h3>Caderninho</h3><div class="cards">'+rows.map(r=>'<div class="card"><span class="composer">⠿ '+r.n+'</span><div><div class="title">'+(r.deleted?'<s>'+r.title+'</s>':r.title)+'</div><div class="label">'+r.label+' · '+r.composer+'</div></div></div>').join('')+'</div>'}else{body='<div class="group">Sambas</div><table>'+rows.map(r=>'<tr class="'+(r.deleted?'removed':'')+'"><td class="num">'+r.n+'</td><td><div class="title">'+(r.deleted?'<s>'+r.title+'</s>':view==='reader'?r.title:'<a>'+r.title+'</a>')+'</div><div class="label">'+r.label+(view==='reader'?' · '+r.composer:'')+'</div></td>'+(view==='reader'?'':'<td class="composer">'+r.composer+'</td>')+(!pub&&r.stale&&view==='details'?'<td class="right"><span class="badge">nova versão</span><br><a>atualizar</a></td>':'<td></td>')+'</tr>').join('')+'</table><p class="hint">Partituras riscadas foram removidas do acervo.</p>'}if(view==='reader'){header='<h1>Carnaval 2026</h1><a>Detalhes, PDF e versões</a><div class="search">⌕ Buscar música ou número</div>';tools=''}if(view==='editor'&&pub){body='<div class="alert">Edição disponível somente para dono/admin do projeto.</div>';tools=''}el('content').innerHTML='<div class="'+(view==='reader'?'reader':'')+'">'+header+tools+body+'</div>'}
for(const id of ['view','state','role'])el(id).onchange=render;render();
</script></html>
