appId: in.cadern.exporter
productName: Exportador cadern.in
directories:
  buildResources: build
  app: _build/export-app/staging
  output: _build/export-app/artifacts
files:
  - dist-electron/**/*
  - dist-export-app/**/*
  - '!node_modules/**/*'
asar: true
npmRebuild: false
# Registers cadernin-export:// (010): CFBundleURLTypes on mac, registry on
# Windows (nsis), MimeType in the .desktop file on Linux.
protocols:
  name: cadernin-export
  schemes:
    - cadernin-export
mac:
  category: public.app-category.music
  identity: null
  target:
    - dmg
win:
  target:
    - nsis
linux:
  category: Audio
  syncDesktopName: true
  target:
    - AppImage
